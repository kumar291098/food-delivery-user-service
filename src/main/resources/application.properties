spring.application.name=user-service
server.port=8081

# Load configurations from Config Server (optional fallback)
spring.config.import=optional:configserver:http://localhost:8888

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/foodflow_user
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Configuration (override in production via JWT_SECRET and JWT_EXPIRATION_MS env vars)
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e5f8g2h6i0j4k8l2m6n0o4p8q2r6s0t4u8v2w6x0y4z8A2B6C0}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

